name: Bug report
description: Something does not work as expected
title: "bug: "
labels: ["type: bug", "status: triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact error text. Remove passwords, hostnames, and row data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to PostgreSQL 17
        2. Run `SELECT ...`
        3. ...
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Database engine
      multiple: true
      options: [PostgreSQL, MySQL, SQLite, Not engine-specific]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: lumen version and OS
      placeholder: v0.0.1 on macOS 15
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
