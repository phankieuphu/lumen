name: release

# Pushing a tag such as v0.0.1 builds the desktop app on Linux, macOS, and
# Windows and publishes a GitHub release with the packages and checksums.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-amd64 }
          - { os: macos-latest, target: macos-universal }
          - { os: windows-latest, target: windows-amd64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/frontend/package-lock.json
      - if: runner.os == 'Linux'
        name: Install GTK 4 and WebKitGTK 6 headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - run: make ui-build
      - run: VERSION=${GITHUB_REF_NAME} scripts/package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist-release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: Checksums
        run: cd dist-release && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${TAG}.md"
          args=(--title "lumen ${TAG}" --verify-tag)
          if [[ -f "$notes" ]]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          # Versions below 1.0 are previews.
          if [[ "$TAG" == v0.* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" dist-release/* "${args[@]}"
